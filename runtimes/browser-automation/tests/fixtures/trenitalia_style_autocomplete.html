<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Trenitalia-style autocomplete fixture (li &gt; button.el-choice)</title>
  </head>
  <body>
    <h1>Cerca stazione</h1>
    <!-- Mirrors the REAL Trenitalia DOM inspected by Olivia:
         - The input has NO role="combobox", no aria-expanded, no aria-controls.
         - The dropdown uses <ul role="listbox"> with <li role="option"> wrappers.
         - The ACTUAL click handler is on <button class="el-choice"> INSIDE the <li>.
         - Clicking the <li> directly does NOT trigger station selection.
         This is the exact structure that broke the old NON_ARIA_OPTION_SELECTOR:
         it matched the <li> but the click went nowhere. -->
    <label>
      Stazione
      <input id="station" placeholder="Digita la stazione" autocomplete="off" />
    </label>
    <div class="list-el train-search" style="display: none">
      <p class="temp-txt">Stazioni</p>
      <ul role="listbox"></ul>
    </div>

    <script>
      const OPTIONS = [
        "Milano Centrale", "Milano Rogoredo", "Milano Porta Garibaldi",
        "Napoli Centrale", "Napoli Campi Flegrei", "Napoli Afragola",
        "Roma Termini", "Roma Tiburtina",
      ];
      const input = document.getElementById("station");
      const container = document.querySelector(".list-el");
      const list = container.querySelector("ul");

      input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        const matches = q ? OPTIONS.filter((o) => o.toLowerCase().includes(q)) : [];
        list.replaceChildren();
        for (const text of matches) {
          const li = document.createElement("li");
          li.setAttribute("role", "option");

          const button = document.createElement("button");
          button.className = "el-choice evidence";
          button.setAttribute("role", "presentation");
          button.type = "button";
          button.tabIndex = -1;

          const icon = document.createElement("i");
          icon.className = "ico-global";
          icon.setAttribute("aria-hidden", "true");
          button.appendChild(icon);
          button.appendChild(document.createTextNode(text));

          // Click handler is on the BUTTON, not on the <li>.
          // This is the critical detail: clicking the <li> does nothing.
          button.addEventListener("click", () => {
            input.value = text;
            container.style.display = "none";
            list.replaceChildren();
          });

          li.appendChild(button);
          list.appendChild(li);
        }
        container.style.display = matches.length ? "block" : "none";
      });
    </script>
  </body>
</html>
