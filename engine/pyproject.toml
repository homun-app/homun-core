[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homun-engine"
version = "0.1.0"
description = "Homun 2 local engine — domain F1 + HTTP handshake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-ai>=1.0.0",
  "dbos>=3.0.0,<4",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
memory = [
  "mem0ai>=0.1.0",
  "qdrant-client>=1.9.0",
]

[project.scripts]
homun-engine = "homun.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homun"]

[tool.hatch.build.targets.wheel.sources]
"src/homun" = "homun"

[tool.hatch.build.targets.sdist]
include = ["src/homun", "README.md", "pyproject.toml", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: live external services (Mem0/Ollama/Qdrant); requires HOMUN_MEM0_LIVE=1",
]
