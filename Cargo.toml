[workspace]
members = [
    "crates/inference-usage",
    "crates/memory",
    "crates/subagents",
    "crates/capabilities",
    "crates/engine",
    "crates/task-runtime",
    "crates/browser-automation",
    "crates/host-computer",
    "crates/process-manager",
    "crates/local-computer-session",
    "crates/secrets",
    "crates/vault",
    "crates/skill-runtime",
    "crates/orchestrator",
    "crates/context-compression",
    "crates/desktop-gateway",
    "crates/inference",
    "crates/process-skill",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Fabio Cantone"]
license = "FSL-1.1-ALv2"
repository = "https://github.com/homun-app/homun-core"
homepage = "https://homun.app"
