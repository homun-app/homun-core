name: Build installers

# Build degli installer di Homun (fase rilascio A4 — adattato da homun2
# .github/workflows/build.yml, solo il job macOS, senza motore Python e senza
# Linux/Windows).
# - Push di un tag v* → macOS arm64 FIRMATO + NOTARIZZATO e pubblicato come
#   DRAFT su homun-app/homun-releases (il feed di aggiornamento di
#   electron-updater), con note dal CHANGELOG e SHA256SUMS-mac.txt.
#   RQ1 (fase rilascio di prova — correzioni): la release nasce BOZZA e
#   diventa prerelease pubblica SOLO all'ULTIMO step, dopo notarizzazione,
#   verify-release, note e checksum — solo per i v*-beta.* (il canale di
#   prova), che poi la vede nel feed. I tag senza -beta. restano BOZZA, da
#   rivedere e pubblicare a mano.
# - PR su main / esecuzione manuale → build NON firmata, solo artifact: prova
#   la pipeline senza taggare.
#
# Security note: nessun input non fidato github.event.* è interpolato negli
# step run. Le uniche espressioni ${{ }} dentro comandi sono secrets e valori
# statici → nessuna superficie di workflow-injection.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # la pubblicazione va su homun-releases via RELEASES_TOKEN

jobs:
  build:
    name: Build (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # RP1 (fase rilascio di prova): in CI non c'è il crate di Engramma (il
      # repo non ha remote) né il bundle llama-server — si prendono dagli
      # ASSET PUBBLICI fissati (vendor/engramma/engramma.lock.json con
      # release { repo, tag }, scripts/llama-pin.json), verificati sha256 e
      # dimensione. Senza segreti. Serve PRIMA di electron-builder (il bundle
      # viaggia in Resources/vendor) e prima dei test (pretest lo rifà, ma a
      # quel punto il fast path ha già tutto).
      - name: Prepare native vendor assets (Engramma + llama-server)
        run: |
          node scripts/prepare-engramma.mjs
          node scripts/fetch-llama.mjs

      # Mai una release da codice rosso: typecheck e test prima di tutto
      # (pretest prepara i .wasm di tree-sitter).
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      # out/ non è nel repo: electron-builder impacchetta SOLO ciò che
      # electron-vite ha compilato (senza questo passo l'asar è senza
      # out/main/index.js e il pacchetto fallisce).
      - name: Build app (electron-vite)
        run: |
          node scripts/prepare-wasm.mjs
          npm run build

      # Su un tag di release il TAG è la fonte unica della versione: si
      # stampa in package.json così installer e latest-mac.yml coincidono.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Il gate della firma sta su un output di step, NON su un'espressione
      # env a livello job: in uno step run il secret c'è davvero.
      - name: Detect macOS signing creds
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID cert present (${#MAC_CSC_LINK} chars) -> signed + notarized build"
          else
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            # Mai una build NON firmata nel feed di aggiornamento: su un tag
            # ci si rifiuta. Le non firmate restano per PR/dispatch, che non
            # pubblicano.
            if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
              echo "::error::Refusing to cut an UNSIGNED macOS release. Set MAC_CSC_LINK before tagging."
              exit 1
            fi
            echo "No MAC_CSC_LINK secret -> unsigned build (dispatch only; will not publish)"
          fi

      - name: Build installer (signed + notarized)
        if: steps.signing.outputs.has_cert == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --mac --publish always -c.mac.notarize=true
        env:
          # RQ1 (fase rilascio di prova — correzioni): la release nasce SEMPRE
          # BOZZA (EP_DRAFT, già il default — detto a parole). Mai più
          # EP_PRE_RELEASE qui: pubblicava la prova DENTRO electron-builder e
          # un fallimento dopo (notarizzazione, verify-release, note,
          # checksum) lasciava nel feed una prova non verificata, e per un
          # tratto un beta-mac.yml caricato senza lo zip (l'updater: 404).
          # La prova diventa prerelease pubblica SOLO nell'ultimo step.
          EP_DRAFT: 'true'
          # il token di pubblicazione vive SOLO su questo step e SOLO sui tag
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # M9 (fase 0.3.1001): lo stato dell'arte per una distribuzione Developer
      # ID è il DMG firmato, notarizzato e GRAFFATO. electron-builder firma il
      # dmg (build.dmg.sign) e notarizza l'APP; il dmg va notarizzato e
      # graffato a parte, con le stesse credenziali dell'app. Il graffaggio
      # avviene PRIMA dei checksum (lo step successivo li calcola).
      - name: Notarize and staple DMG
        if: steps.signing.outputs.has_cert == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          DMG="$(find dist-installers -maxdepth 2 -name '*.dmg' -print -quit)"
          test -n "$DMG" || { echo "::error::nessun dmg in dist-installers"; exit 1; }
          echo "notarize: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          # electron-builder ha già pubblicato il dmg PRE-graffaggio: si ricarica
          # quello graffato sulla draft release (i checksum si calcolano dopo)
          gh release upload "$GITHUB_REF_NAME" "$DMG" \
            --repo homun-app/homun-releases \
            --clobber

      - name: Build installer (unsigned — no cert or non-release build)
        if: steps.signing.outputs.has_cert != 'true' || !startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --mac --publish never -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged app
        shell: bash
        run: |
          APP_PATH="$(find dist-installers -maxdepth 3 -type d -iname Homun.app -print -quit)"
          test -n "$APP_PATH"
          VERSION="$(node -p "require('./package.json').version")"
          # lo script npm release:verify ha già percorso e versione fissi:
          # qui si chiama lo script diretto col percorso trovato
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ] && [ "${{ steps.signing.outputs.has_cert }}" = "true" ]; then
            node scripts/verify-release.mjs "$APP_PATH" --expected-arch arm64 --expected-version "$VERSION" --signed
          else
            node scripts/verify-release.mjs "$APP_PATH" --expected-arch arm64 --expected-version "$VERSION"
          fi

      - name: Create installer checksums
        run: npm run release:checksums -- --directory dist-installers --output "dist-installers/SHA256SUMS-mac.txt"

      # Le note vengono da CHANGELOG.md (fonte unica): extract-release-notes
      # esce non-zero se il tag non ha sezione — mai una release senza note.
      - name: Set release notes from CHANGELOG.md
        if: steps.signing.outputs.has_cert == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$GITHUB_REF_NAME" \
            --repo homun-app/homun-releases \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Upload checksums to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist-installers/SHA256SUMS-mac.txt" \
            --repo homun-app/homun-releases \
            --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homun-macos-arm64
          path: |
            dist-installers/*.dmg
            dist-installers/*.zip
            dist-installers/*.yml
            dist-installers/SHA256SUMS-*.txt
          if-no-files-found: error

      # RQ1 (fase rilascio di prova — correzioni): lo schema «bozza, controlli,
      # poi pubblicazione». Questo è l'ULTIMO step: la prova nasce BOZZA sopra
      # e diventa prerelease pubblica SOLO ORA — dopo notarizzazione e
      # graffaggio del dmg, verify-release (firma, Team ID, runtime dei
      # Mach-O di vendor), note dal CHANGELOG e SHA256SUMS-mac.txt. Tutti i
      # file sono già caricati sulla bozza: pubblicando alla fine non c'è mai
      # una finestra con il file canale sì e lo zip no. Solo i tag v*-beta.*
      # (il canale di prova) e solo col certificato; i tag senza -beta. restano
      # BOZZA come sempre, da rivedere e pubblicare a mano.
      - name: Publish prerelease (v*-beta.* only)
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.') && steps.signing.outputs.has_cert == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo homun-app/homun-releases --draft=false --prerelease
          # la pubblicazione si VERIFICA: se non risulta prerelease pubblica,
          # lo step fallisce (la CI è rossa, non silenziosa)
          STATE="$(gh release view "$GITHUB_REF_NAME" --repo homun-app/homun-releases --json isDraft,isPrerelease)"
          echo "release dopo la pubblicazione: $STATE"
          IS_DRAFT="$(node -p 'JSON.parse(process.argv[1]).isDraft' "$STATE")"
          IS_PRE="$(node -p 'JSON.parse(process.argv[1]).isPrerelease' "$STATE")"
          if [ "$IS_DRAFT" != "false" ] || [ "$IS_PRE" != "true" ]; then
            echo "::error::la prova non risulta prerelease pubblica (isDraft=$IS_DRAFT, isPrerelease=$IS_PRE)"
            exit 1
          fi
